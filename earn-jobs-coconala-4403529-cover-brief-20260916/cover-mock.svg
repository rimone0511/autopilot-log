  <text x="610" y="338" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="36" font-weight="500" fill="#1F6B5C">公開スイッチは人です</text>
  <g font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="28" font-weight="600" text-anchor="middle">
